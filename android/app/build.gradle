plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sinnaruggggg.nanaoffice'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sinnaruggggg.nanaoffice'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    sourceSets.main.assets.srcDirs = ['../../dist']
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

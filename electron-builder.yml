appId: com.sinnaruggggg.nanaoffice
productName: NANAOFFICE
npmRebuild: false
artifactName: NANAOFFICE-Setup-${version}-${arch}.${ext}
directories:
  output: release
files:
  - desktop/**
  - dist/**
  - package.json
  - "!node_modules/**"
win:
  target:
    - target: msi
      arch: [x64]
  icon: branding/icon.ico
  fileAssociations:
    - ext: [hwp, hwpx, xlsx, pptx, pdf, docx, csv, tsv, txt, md]
      role: Editor
      name: NANAOFFICE 문서
      icon: branding/icon.ico
msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  shortcutName: NANAOFFICE
  runAfterFinish: false

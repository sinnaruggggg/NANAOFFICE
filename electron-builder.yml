appId: com.sinnaruggggg.nanaoffice
productName: NANAOFFICE
msiProjectCreated: ./scripts/localize-msi.cjs
npmRebuild: false
artifactName: NANAOFFICE-Setup-${version}-${arch}.${ext}
directories:
  output: release
files:
  - desktop/**
  - dist/**
  - package.json
  - "!node_modules/**"
win:
  extraResources:
    - from: .office-build/DesktopEditors_x64.zip
      to: office/DesktopEditors_x64.zip
    - from: desktop/resources
      to: office
  target:
    - target: msi
      arch: [x64]
  icon: branding/icon.ico
  fileAssociations:
    - ext: [hwp, hwpx, xlsx, pptx, pdf, docx, csv, tsv, txt, md]
      role: Editor
      name: NANAOFFICE 문서
      icon: branding/icon.ico
msi:
  additionalLightArgs:
    - -cultures:ko-kr
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  shortcutName: NANAOFFICE
  runAfterFinish: false

name: Upload Windows installer to draft release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Windows build run ID
        required: true
        type: string
      release_tag:
        description: Existing draft release tag
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  upload:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NANAOFFICE-windows
          path: installer
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Verify and upload installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $files = @(Get-ChildItem installer -File -Filter 'NANAOFFICE-Setup-*-x64.msi')
          if ($files.Count -ne 1 -or $files[0].Name -ne "NANAOFFICE-Setup-$($tag.Substring(1))-x64.msi") {
            throw 'Installer version does not match draft release'
          }
          $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if (!$draft.isDraft) { throw 'The target must be a draft release' }
          $msi = $files[0].FullName
          $image = (New-Item -ItemType Directory -Path install-check).FullName
          $args = '/a "{0}" TARGETDIR="{1}" /qn' -f $msi,$image
          $result = Start-Process msiexec.exe -ArgumentList $args -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer extraction exited with $($result.ExitCode)" }
          $archive = Join-Path $image 'NANAOFFICE/resources/office/DesktopEditors_x64.zip'
          $expected = '54979d04f1cdca56deb0c62e0356355a45f392cdb54f04f6b7e436b1f44c3605'
          if ((Get-FileHash $archive).Hash -ne $expected) { throw 'Bundled editor digest mismatch' }
          gh release upload $tag $msi --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = (gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets
          $actual = 'sha256:' + (Get-FileHash $msi).Hash.ToLowerInvariant()
          if ($assets.Count -ne 1 -or $assets[0].digest -ne $actual -or $assets[0].state -ne 'uploaded') {
            throw 'Release installer digest mismatch'
          }
          "Verified installer upload: $actual"

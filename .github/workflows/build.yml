name: Build packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: NANAOFFICE-windows
          path: release/*.msi
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: npm ci
      - run: npm run build
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle -p android :app:assembleRelease :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NANAOFFICE-android-unsigned
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
      - name: Prepare KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify compact Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/smoke-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NANAOFFICE-android-ui
          path: nana-mobile-*.png
